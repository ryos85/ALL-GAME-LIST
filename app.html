<body>
<div id="lock" class="lock"><div class="lockbox"><div class="brandmark">▤</div><h1>ゲームリスト</h1><p id="lockmessage">リストを読み込んでいます。</p><button id="retry" class="btn" hidden>もう一度読み込む</button></div></div>
<div id="app" class="app" hidden>
<main>
 <header class="topbar"><h1 class="app-title">ゲームリスト</h1><div class="toolbar"><span class="mode" id="mode-label">閲覧専用</span><button class="btn previewbtn" id="preview" hidden>閲覧画面</button><button class="btn primary" id="publish" hidden>スマホ用を更新</button></div></header>
 <nav class="views" aria-label="一覧の切り替え">
<button class="view-tab active" data-view="all">全件<strong id="stat-all">0</strong></button>
<button class="view-tab" data-view="wanted">探し中<strong id="stat-wanted">0</strong></button>
<button class="view-tab" data-view="interested">興味あり<strong id="stat-interested">0</strong></button>
<button class="view-tab" data-view="owned">ROM所有<strong id="stat-owned">0</strong></button>
</nav>
 <section><h2 id="view-title" class="sr-only">すべてのゲーム</h2>
 <div class="searchline"><div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" autocomplete="off" placeholder="タイトル・メーカー・メモを検索" aria-label="タイトル・メーカー・メモを検索"><button id="clearsearch" class="clearsearch" aria-label="検索文字を消す" hidden>×</button></div><div class="hardware-picker"><button id="hardware-toggle" class="filter" aria-expanded="false" aria-controls="hardware-panel"><span id="hardware-label">すべての機種</span><span aria-hidden="true">▾</span></button><div id="hardware-panel" class="hardware-panel" aria-label="会社・ハード・カテゴリ" hidden></div><select id="platform" hidden aria-label="機種"><option value="">すべての機種</option></select></div><select id="year" class="filter" aria-label="発売年"><option value="">すべての年</option></select><button class="btn filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-options">絞り込み</button></div>
 <div class="filters" id="filter-options"><div class="interest-options" aria-label="興味で絞り込み"><span class="filter-label">興味</span><button class="chip active" data-interest="">すべて</button><button class="chip" data-interest="unknown">未確認</button><button class="chip" data-interest="curious">気になる</button><button class="chip" data-interest="play">遊びたい</button><button class="chip" data-interest="none">興味なし</button></div><select id="genre" class="filter" aria-label="ジャンル"><option value="">すべてのジャンル</option></select><select id="sort" class="filter" aria-label="並び順"><option value="date">発売日が古い順</option><option value="new">発売日が新しい順</option><option value="title">タイトル順</option></select><select id="owned-filter" class="filter" aria-label="ROM所有で絞り込み"><option value="">ROM所有：すべて</option><option value="yes">ROM所有あり</option><option value="no">ROM所有なし</option><option value="unknown">ROM所有未確認</option></select><button id="reset" class="reset">条件をクリア</button></div>
 <div id="notice" class="notice" hidden></div><div class="resultline"><span><strong id="result-count">0</strong>本 <span id="page-range"></span> <span id="publish-state"></span></span><span id="section-note" class="section-note"></span><div class="pagination" hidden><button class="btn" data-page="prev">前へ</button><span class="page-number"></span><button class="btn" data-page="next">次へ</button></div></div>

 <div class="list"><div class="list-head"><span class="game-info-head"><span>発売日</span><span>タイトル / ゲーム情報</span></span><span>興味</span><span>ROM<span class="owned-word">所有</span></span><span>探し中</span></div><div id="games"></div></div>
 <div class="pagination" hidden><button class="btn" data-page="prev">前へ</button><span class="page-number"></span><button class="btn" data-page="next">次へ</button></div>
 </section>
 <footer class="footer"><div id="footer-copy">タイトルを押すと、メモと詳しい情報を確認できます。</div><div><span id="updated"></span> <button id="reload">再読み込み</button></div></footer>
</main></div>
<dialog id="detail"><div class="dialog-inner" id="detail-content"></div></dialog>
<dialog id="share"><div class="dialog-inner"><div class="dialog-top"><h2>スマホで開く</h2></div><p style="font-size:13px;line-height:1.9">下の専用URLをスマホへ送り、ブックマークしてください。次回からパスワード入力なしで開けます。</p><p style="font-size:11px;color:var(--muted)">このURLを持つ人は記録を閲覧できます。ご自身だけでお使いください。</p><input id="share-url" readonly aria-label="スマホ専用URL" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:11px"><div class="dialog-actions"><button class="btn" id="copy-url">URLをコピー</button><a class="btn primary" id="open-viewer" target="_blank" rel="noopener noreferrer" style="text-decoration:none" href="#">閲覧画面を開く</a></div></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const EDITOR=/*LOCAL_MODE*/false;

function familyOf(g){return platformInfo[g.platform]?.family||g.family||(g.platform==='NGPC'?'NGP':g.platform);}
function platformMatches(g,value){return !value||(value.startsWith('maker:')?platformMaker(g)===value.slice(6):value.startsWith('family:')?familyOf(g)===value.slice(7):g.platform===value);}
const MAKERS={nintendo:{name:'任天堂',families:['FC','FDS','SFC','N64','GC','Wii','WII','WiiU','WIIU','GB','GBA','NDS','DS','3DS','Switch','SWITCH','Switch2','SWITCH2']},sony:{name:'ソニー',families:['PS','PS1','PS2','PS3','PS4','PS5','PSP','PSV','VITA']},sega:{name:'セガ',families:['SG1000','SG-1000','MK3','SMS','MD','GG','SS','DC']},'nec-hudson':{name:'NEC・ハドソン',families:['PCE','PC-FX','PCFX']},snk:{name:'SNK',families:['NG','NGCD','NGP']},bandai:{name:'バンダイ',families:['WS']},other:{name:'その他',families:[]}};
const HARDWARE_NAMES={PS:'PlayStation',PS2:'PlayStation 2',PS3:'PlayStation 3',PSP:'PlayStation Portable',PSV:'PlayStation Vita'};
const CATEGORY_NAMES={SFC:'通常ソフト','SFC-NP':'ニンテンドウパワー専用','SFC-TURBO':'スーファミターボ専用',DC:'通常ソフト','DC-VM':'ビジュアルメモリ内蔵ソフト',NGP:'モノクロ',NGPC:'カラー',WS:'モノクロ',WSC:'カラー',PCE:'HuCard','PCE-CD':'CD-ROM²','PCE-SCD':'SUPER CD-ROM²','PCE-ACD':'アーケードカード専用',SGX:'スーパーグラフィックス専用','PCE-GE':'GAMES EXPRESS CD CARD専用',MD:'通常ソフト',MCD:'メガCD','32X':'スーパー32X',GB:'モノクロ','GB-GBC':'モノクロ・カラー共通',GBC:'カラー専用',N64:'通常ソフト','N64-DD':'64DD専用',NDS:'通常ソフト',DSi:'DSi専用・DSiウェア','3DS':'通常ソフト','3DS-VC':'バーチャルコンソール',New3DS:'New 3DS専用','New3DS-VC':'New 3DS専用 バーチャルコンソール'};
function makerOfFamily(family){return Object.keys(MAKERS).find(key=>MAKERS[key].families.includes(family))||'other';}
function platformMaker(g){return makerOfFamily(familyOf(g));}
function categoryName(code){return CATEGORY_NAMES[code]||'ソフト一覧';}
function hardwareSelectionLabel(value){if(!value)return 'すべての機種';if(value.startsWith('maker:'))return MAKERS[value.slice(6)].name;if(value.startsWith('family:'))return familyInfo[value.slice(7)];const family=platformInfo[value]?.family||value;return familyInfo[family]+' / '+categoryName(value);}

function platformTag(g,full=false){const info=platformInfo[g.platform];return '<span class="tag" data-platform="'+esc(g.platform)+'" data-maker="'+platformMaker(g)+'" title="'+esc(PLATFORM[g.platform]||g.platform)+'">'+esc((full?(PLATFORM[g.platform]||g.platform):(info?.badge||g.platform))+(g.licenseStatus==='unlicensed'?' 非公認':''))+'</span>';}
function sourceDetails(g){const records=g.sourceRecords||[{sheet:g.sourceSheet||'ネオジオポケット',row:g.sourceRow,...g.legacy,genre:g.originalGenre,note:''}];return (g.originalCatalog?'<p>訂正前のタイトル：'+esc(g.originalCatalog.title)+'<br>訂正前の発売日：'+esc(g.originalCatalog.releaseDate)+'</p>':'')+records.map(r=>'<p>元のExcel：'+esc(r.sheet)+' '+esc(r.row)+'行目 ／ 元のNo：'+esc(Object.hasOwn(r,'no')?(r.no??'未記入'):(g.displayNo??g.id.split('-').at(-1)))+'<br>所有：'+(esc(r.owned)||'空欄')+' ／ 評価：'+(esc(r.rating)||'空欄')+' ／ 遊びたい：'+(esc(r.want)||'空欄')+'<br>ジャンル：'+(esc(r.genre)||'空欄')+(r.note?'<br>備考：'+esc(r.note):'')+'</p>').join('');}
function platformOptions(){
 const counts={};for(const g of data.games)counts[g.platform]=(counts[g.platform]||0)+1;

 const choice=(value,name,count)=>'<button class="hardware-choice" data-hardware="'+esc(value)+'">'+esc(name)+'<span>'+count.toLocaleString('ja-JP')+'本</span></button>';

  const families=Object.keys(familyInfo).filter(f=>makerOfFamily(f)===maker);if(!families.length)continue;

   options+='<option value="family:'+esc(family)+'"'+(!count?' disabled':'')+'>'+esc(familyInfo[family])+'</option>';
   tree+='<details class="hardware-family"><summary>'+esc(familyInfo[family])+'<span>'+(count?count.toLocaleString('ja-JP')+'本':'未登録')+'</span></summary><div class="hardware-categories">';
   if(codes.filter(code=>counts[code]).length>1)tree+=choice('family:'+family,'全カテゴリ',count);
   for(const code of codes){options+='<option value="'+esc(code)+'"'+(!counts[code]?' disabled':'')+'>'+esc(PLATFORM[code])+'</option>';tree+=counts[code]?choice(code,categoryName(code),counts[code]):'<div class="hardware-empty">'+esc(categoryName(code))+'<span>未登録</span></div>';}
   tree+='</div></details>';
  }

const bookmark='<svg viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h10v16l-5-3-5 3z"/></svg>';
async function api(path,body){const response=await fetch(path,{cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const result=await response.json();if(!response.ok)throw Error(result.error||'処理を完了できませんでした。');return result;}

function setNotice(message=''){ $('notice').textContent=message;$('notice').hidden=!message; }
function status(){if(!EDITOR)return;$('mode-label').textContent=failedSave?'保存失敗':pending?'保存中…':'PCに保存済み';$('publish-state').textContent=data.revision>publishedRevision?'・スマホ用に未反映':'';}
function selectedGames(){const q=norm($('search').value),sort=$('sort').value,platform=$('platform').value,year=$('year').value,genre=$('genre').value,owned=$('owned-filter').value;return data.games.filter(g=>(view!=='wanted'||g.wanted)&&(view!=='interested'||['curious','play'].includes(g.interest))&&(view!=='owned'||g.owned==='yes')&&(!interest||g.interest===interest)&&platformMatches(g,platform)&&(!year||g.releaseDate.slice(0,4)===year)&&(!genre||g.genre===genre)&&(!owned||g.owned===owned)&&(!q||norm([g.title,...(g.aliases||[]),g.originalCatalog?.title,g.publisher,g.memo,g.genre,g.title.startsWith('キング・オブ・ファイターズ')?'KOF':''].join(' ')).includes(q))).sort((a,b)=>sort==='title'?titleCompare(a.title,b.title):sort==='new'?b.releaseDate.localeCompare(a.releaseDate)||titleCompare(a.title,b.title)||a.id.localeCompare(b.id):releaseCompare(a,b));}
function stateControl(g,field,labels){const val=g[field];return EDITOR?`<select class="state-select" data-id="${esc(g.id)}" data-field="${field}" data-value="${esc(val)}" aria-label="${esc(g.title)}の${field==='interest'?'興味':'ROM所有'}">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v}</option>`).join('')}</select>`:`<span class="readstate ${esc(val)}">${esc(labels[val]||val)}</span>`;}
function render(){syncHardwarePicker();$('app').dataset.view=view;const counts={all:data.games.length,wanted:data.games.filter(g=>g.wanted).length,interested:data.games.filter(g=>['curious','play'].includes(g.interest)).length,owned:data.games.filter(g=>g.owned==='yes').length};for(const k of Object.keys(counts)){ $('stat-'+k).textContent=counts[k];}document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));document.querySelectorAll('[data-interest]').forEach(el=>el.classList.toggle('active',el.dataset.interest===interest));$('view-title').textContent=VIEWS[view];const chosen=$('platform').value;$('section-note').textContent=chosen?hardwareSelectionLabel(chosen):new Set(data.games.map(familyOf)).size+'機種 / '+new Set(data.games.map(g=>g.platform)).size+'区分';const matches=selectedGames();page=Math.min(page,Math.max(0,Math.ceil(matches.length/PAGE_SIZE)-1));const games=matches.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);$('result-count').textContent=matches.length.toLocaleString('ja-JP');$('page-range').textContent=matches.length?'（'+(page*PAGE_SIZE+1)+'〜'+(page*PAGE_SIZE+games.length)+'本を表示）':'';for(const controls of document.querySelectorAll('.pagination')){controls.hidden=matches.length<=PAGE_SIZE;controls.querySelector('[data-page="prev"]').disabled=page===0;controls.querySelector('[data-page="next"]').disabled=(page+1)*PAGE_SIZE>=matches.length;controls.querySelector('.page-number').textContent=(page+1)+' / '+Math.max(1,Math.ceil(matches.length/PAGE_SIZE));}$('clearsearch').hidden=!$('search').value;$('updated').textContent='記録更新 '+new Date(data.updatedAt).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});$('games').innerHTML=games.length?games.map(g=>`<article class="game" data-game="${esc(g.id)}"><button class="game-title" data-detail="${esc(g.id)}"><span class="release-date" title="${esc(dateLabel(g))}">${esc(g.releaseDate.replaceAll('-','.'))}${dateUncertain(g)?' function resetFilters(resetView=false){page=0;if(resetView)view='all';interest='';$('search').value='';$('platform').value='';$('year').value='';$('genre').value='';$('owned-filter').value='';render();}

function queueUpdate(id,changes){pending++;status();saving=saving.then(async()=>{if(failedSave)throw Error('保存に失敗した変更があります。再読み込みしてからやり直してください。');const updated=await api('/api/update',{id,changes,revision:data.revision});data=updated;render();return updated;}).catch(err=>{failedSave=true;setNotice(err.message);toast(err.message,true);}).finally(()=>{pending--;status();});return saving;}
function googleSearchLink(g){const query=g.title+' '+(familyInfo[familyOf(g)]||PLATFORM[g.platform]||g.platform);return '<a class="btn google-search" href="https://www.google.com/search?q='+esc(encodeURIComponent(query))+'" target="_blank" rel="noopener noreferrer" title="'+esc(query)+'">Googleで検索 <span aria-hidden="true">↗</span></a>';}
let detailHistory=[];
function relatedContent(g){
 const relations=data.relationships||{series:[],links:[]},lookup=new Map(data.games.map(item=>[item.id,item]));
 const versions=relations.links.filter(link=>link.a===g.id||link.b===g.id).map(link=>{const forward=link.a===g.id;return {game:lookup.get(forward?link.b:link.a),label:({port:'移植',remake:forward?'リメイク':'原作',collection:forward?'収録版':'収録作品'})[link.kind],sources:link.sources};}).filter(item=>item.game).sort((a,b)=>releaseCompare(a.game,b.game));

 const peers=[...new Set(series.flatMap(item=>item.games))].filter(id=>id!==g.id&&!versionIds.has(id)).map(id=>lookup.get(id)).filter(Boolean).sort(releaseCompare);
 const row=(game,label='')=>'<button class="related-game" data-related="'+esc(game.id)+'"><span><strong>'+esc(game.title)+'</strong><span class="related-meta">'+platformTag(game)+'<span>'+esc(game.releaseDate)+'</span>'+(label?'<span class="relation-kind">'+esc(label)+'</span>':'')+'</span></span><span aria-hidden="true">›</span></button>';
 const sources=[...new Set([...versions.flatMap(item=>item.sources),...series.flatMap(item=>item.sources)])];
 if(!versions.length&&!peers.length)return '';
 return '<section class="related-section"><p class="related-note">登録済みの関連付けを表示</p>'+(versions.length?'<details open><summary>他機種版・リメイク <span>'+versions.length+'件</span></summary><div class="related-list">'+versions.map(item=>row(item.game,item.label)).join('')+'</div></details>':'')+(peers.length?'<details><summary>同じシリーズ <span>'+peers.length+'件</span> <small>'+esc(series.map(item=>item.name).join('・'))+'</small></summary><div class="related-list">'+peers.map(game=>row(game)).join('')+'</div></details>':'')+'<details class="relation-sources"><summary>関連付けの資料</summary><div class="source-links">'+sources.map((url,i)=>'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">資料 '+(i+1)+' ↗</a>').join('')+'</div></details></section>';
}

function showDetail(id,{related=false,back=false}={}){const g=data.games.find(g=>g.id===id);if(!g)return;if(pending){toast('保存が完了してから開いてください。');return;}if(memoDirty&&!confirm('保存していないメモを破棄して、別の作品へ移動しますか？'))return;let restoredScroll=0,restoredExpanded=null;if(back){const entry=detailHistory.pop();restoredScroll=entry.scroll;restoredExpanded=entry.expanded;}else if(related&&currentDetail){detailHistory.push({id:currentDetail,scroll:$('detail').scrollTop,expanded:[...$('detail-content').querySelectorAll('details')].map(el=>el.open)});}else detailHistory=[];currentDetail=id;memoDirty=false;$('detail-content').innerHTML=`${detailHistory.length?'<button class="btn relation-back" data-relation-back>← 前の作品へ</button>':''}<div class="dialog-top"><div>${platformTag(g,true)}<h2 tabindex="-1">${esc(g.title)}</h2>${googleSearchLink(g)}</div></div><dl class="details"><dt>発売日</dt><dd><strong>${dateUncertain(g)?'未確定':esc(g.releaseDate)}</strong>${dateUncertain(g)?'<br><small>並び順用の記録：'+esc(g.releaseDate)+'</small>':''} <span style="color:var(--muted);font-size:10px">（${esc(dateLabel(g))}）</span></dd><dt>発売元</dt><dd>${esc(g.publisher)}</dd><dt>ジャンル</dt><dd>${esc(g.genre)}</dd><dt>対応区分</dt><dd>${esc(g.compatibilityLabel||COMPAT[g.compatibility]||'未確認')}</dd><dt>興味 / ROM</dt><dd>${esc(LABEL[g.interest])} / ${esc(OWNED[g.owned])}</dd><dt>探し中</dt><dd>${g.wanted?'探しているソフトに登録済み':'未登録'}</dd></dl><label class="memo-label" for="memo">メモ</label>${EDITOR?`<textarea id="memo" maxlength="4000" placeholder="探すときの条件や、気になったことをメモ">${esc(g.memo)}</textarea><div class="dialog-actions"><button class="btn primary" id="save-memo">メモを保存</button></div>`:`<div class="readonly-memo">${esc(g.memo)||'メモはありません。'}</div>`}${relatedContent(g)}${releaseEvidence(g)}<details><summary>以前の記録・分類の根拠</summary>${sourceDetails(g)}${editionRecords(g)}<p>${esc(g.classificationNote)}</p><div class="source-links">${g.classificationSources.filter(url=>url.startsWith('https://')).map((url,i)=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">参考資料 ${i+1} ↗</a>`).join('')}</div></details>`;if(!$('detail').open)$('detail').showModal();if(restoredExpanded)[...$('detail-content').querySelectorAll('details')].forEach((el,i)=>el.open=!!restoredExpanded[i]);$('detail').scrollTop=restoredScroll;if(related||back)$('detail-content').querySelector('h2').focus({preventScroll:true});if(EDITOR){$('memo').oninput=()=>{memoDirty=true;};$('save-memo').onclick=async()=>{const button=$('save-memo');button.disabled=true;await queueUpdate(id,{memo:$('memo').value});button.disabled=false;if(!failedSave){memoDirty=false;toast('メモを保存しました。');}};}}
function closeDetail(){if(memoDirty&&!confirm('保存していないメモを閉じますか？'))return;$('detail').close();currentDetail=null;memoDirty=false;detailHistory=[];}
async function decryptLibrary(){const encodedKey=new URLSearchParams(location.hash.slice(1)).get('k');if(!encodedKey)throw Error('ご自身の専用URLから開いてください。\nPCの「閲覧画面」から専用URLを確認できます。');if(!/^[A-Za-z0-9_-]{43}$/.test(encodedKey))throw Error('専用URLの鍵が正しくありません。PCからURLを確認してください。');const b64=s=>{const binary=atob(s),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;};const raw=b64(encodedKey.replaceAll('-','+').replaceAll('_','/')+'=');const response=await fetch('./library.enc.json',{cache:'no-cache'});if(!response.ok)throw Error('記録を取得できません。通信状態を確認して再読み込みしてください。');const envelope=await response.json();if(![1,2].includes(envelope.schemaVersion)||envelope.algorithm!=='AES-256-GCM'||(envelope.schemaVersion===2&&envelope.compression!=='gzip'))throw Error('この記録形式には対応していません。');try{const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(envelope.iv),additionalData:new TextEncoder().encode('all-game-list:v1')},key,b64(envelope.ciphertext));const decoded=envelope.compression==='gzip'?await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer():plain;return JSON.parse(new TextDecoder().decode(decoded));}catch{throw Error('この専用URLでは記録を開けません。PCで最新の専用URLを確認してください。');}}
async function boot(){try{data=EDITOR?await api('/api/library'):await decryptLibrary();if(data.schemaVersion!==1||!Array.isArray(data.games))throw Error('記録形式が正しくありません。');if(EDITOR){const info=await api('/api/info');publishedRevision=info.publishedRevision;}platformInfo=data.platforms||{NGP:{name:'ネオジオポケット',badge:'NGP',family:'NGP'},NGPC:{name:'ネオジオポケットカラー',badge:'NGPC',family:'NGP'}};familyInfo=data.families||{NGP:'ネオジオポケット'};familyInfo={...familyInfo,...Object.fromEntries(Object.entries(HARDWARE_NAMES).filter(([key])=>key in familyInfo))};platformInfo=Object.fromEntries(Object.entries(platformInfo).map(([k,v])=>[k,{...v,name:HARDWARE_NAMES[k]||v.name}]));PLATFORM=Object.fromEntries(Object.entries(platformInfo).map(([k,v])=>[k,v.name]));$('platform').innerHTML=platformOptions();$('year').innerHTML='<option value="">すべての年</option>'+[...new Set(data.games.map(g=>g.releaseDate.slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse().map(y=>'<option value="'+y+'">'+y+'年</option>').join('');$('genre').innerHTML='<option value="">すべてのジャンル</option>'+[...new Set(data.games.map(g=>g.genre))].sort((a,b)=>a.localeCompare(b,'ja')).map(g=>`<option>${esc(g)}</option>`).join('');$('mode-label').textContent=EDITOR?'PCに保存済み':'閲覧専用';for(const id of ['publish','preview'])$(id).hidden=!EDITOR;$('footer-copy').textContent=EDITOR?'変更はPCに自動保存されます。「スマホ用を更新」で閲覧ページに反映します。':'閲覧専用です。タイトルを押すと、メモと詳しい情報を確認できます。';$('lock').hidden=true;$('app').hidden=false;render();}catch(err){$('lockmessage').textContent=err.message;$('retry').hidden=false;}}
$('filter-toggle').onclick=()=>{const open=$('filter-options').classList.toggle('expanded');$('filter-toggle').setAttribute('aria-expanded',String(open));$('filter-toggle').textContent=open?'絞り込みを閉じる':'絞り込み';};
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>changeView(el.dataset.view));document.querySelectorAll('[data-interest]').forEach(el=>el.onclick=()=>{interest=el.dataset.interest;page=0;render();});$('search').oninput=()=>{page=0;render();};for(const id of ['platform','year','genre','sort','owned-filter'])$(id).onchange=()=>{page=0;render();};$('clearsearch').onclick=()=>{$('search').value='';page=0;render();$('search').focus();};$('reset').onclick=()=>resetFilters();$('games').addEventListener('click',event=>{const detail=event.target.closest('[data-detail]');if(detail)return showDetail(detail.dataset.detail);const wanted=event.target.closest('[data-wanted]');if(wanted&&EDITOR){const g=data.games.find(g=>g.id===wanted.dataset.wanted);wanted.disabled=true;queueUpdate(g.id,{wanted:!g.wanted});}if(event.target.id==='empty-reset')resetFilters(true);});$('games').addEventListener('change',event=>{const el=event.target.closest('[data-field]');if(el&&EDITOR){el.disabled=true;queueUpdate(el.dataset.id,{[el.dataset.field]:el.value});}});$('detail').addEventListener('cancel',event=>{event.preventDefault();closeDetail();});$('reload').onclick=()=>location.reload();$('retry').onclick=()=>location.reload();window.addEventListener('beforeunload',event=>{if(pending||memoDirty||failedSave){event.preventDefault();event.returnValue='';}});
$('preview').onclick=async()=>{try{await saving;if(failedSave)throw Error('未保存の変更があります。再読み込みして確認してください。');await api('/api/export',{});const links=await api('/api/links');shareLink=links.public||new URL(links.preview,location.origin).href;$('share-url').value=shareLink;$('open-viewer').href=shareLink;$('share').showModal();}catch(err){toast(err.message,true);}};$('copy-url').onclick=async()=>{try{await navigator.clipboard.writeText(shareLink);toast('専用URLをコピーしました。');}catch{$('share-url').select();toast('URLを選択しました。コピーしてお使いください。');}};
$('publish').onclick=async()=>{const button=$('publish');button.disabled=true;button.textContent='更新中…';try{await saving;if(failedSave)throw Error('未保存の変更があります。再読み込みして確認してください。');const result=await api('/api/publish',{});if(result.published)publishedRevision=result.revision;status();toast(result.message,!result.published);}catch(err){toast(err.message,true);}finally{button.disabled=false;button.textContent='スマホ用を更新';}};
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{page+=button.dataset.page==='next'?1:-1;render();document.querySelector('.resultline').scrollIntoView({block:'start'});});
for(const id of ['detail','share']){
 const dialog=$(id);let startedOutside=false;
 const outside=event=>{const r=dialog.getBoundingClientRect();return event.target===dialog&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom);};
 dialog.addEventListener('pointerdown',event=>{startedOutside=outside(event);});
 dialog.addEventListener('click',event=>{const dismiss=startedOutside&&outside(event);startedOutside=false;if(dismiss){if(id==='detail')closeDetail();else dialog.close();}});
}
window.addEventListener('hashchange',()=>{if(!EDITOR){data=null;$('detail').close();$('share').close();$('games').innerHTML='';$('app').hidden=true;$('lock').hidden=false;$('lockmessage').textContent='リストを読み込んでいます。';$('retry').hidden=true;boot();}});
boot();
</script>
</body></html>
