<style>

.searchline{display:flex;gap:8px}.searchbox{position:relative;flex:1;min-width:0}.searchbox svg{position:absolute;left:10px;top:9px;width:17px;height:17px;color:var(--muted)}.searchbox input{width:100%;height:36px;border:1px solid #bac5ce;border-radius:4px;padding:0 34px;font-size:14px;background:white;color:var(--ink)}.clearsearch{position:absolute;right:3px;top:2px;width:32px;height:32px}.filter{height:34px;max-width:210px;min-width:0;border:1px solid #c6cfd6;border-radius:4px;background:white;padding:0 7px;font-size:12px;color:var(--ink)}.filters{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 0}.interest-options{display:flex;align-items:center;gap:4px}.filter-label{color:var(--muted);font-size:12px;margin-right:4px}.chip{border:1px solid #d4dce2;border-radius:4px;font-size:12px;min-height:30px;padding:4px 9px}.chip.active{color:var(--green);border-color:#85a9c5;background:#edf4fa}.reset{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}.filter-toggle{display:none}.resultline{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:29px;font-size:12px;color:var(--muted)}.resultline strong{color:var(--ink)}.section-note{font-size:11px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.list{border:1px solid var(--line)}.list-head,.game{display:grid;grid-template-columns:minmax(240px,1fr) 104px 80px 68px;gap:12px;align-items:center;padding:0 10px}.list-head{position:sticky;top:0;z-index:2;min-height:28px;background:#edf0f3;border-bottom:1px solid #ccd5dd;font-size:12px;color:#52616c}.game{min-height:48px;border-bottom:1px solid #e4e8eb;padding-top:4px;padding-bottom:4px}.game:last-child{border-bottom:0}.game:nth-child(even){background:#f7f9fa}.game:hover{background:#eef5fa}.game-title{display:flex;align-items:center;gap:8px;text-align:left;width:100%;min-width:0;padding:0;min-height:38px}.mobile-number{display:none}.number{font-size:11px;color:#84919c;width:24px;flex-shrink:0;font-variant-numeric:tabular-nums}.titlecopy{min-width:0}.titlecopy>strong{display:block;font-size:13px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:2px;font-size:11px;line-height:1.3;color:var(--muted)}.tag{font-size:11px;font-weight:700;line-height:1.4;padding:0 4px;border:1px solid transparent;border-radius:2px;white-space:nowrap}.tag.ngp{background:#4d5b66;color:#fff}.tag.ngpc{background:#245e87;color:#fff}.meta-date{font-size:12px;font-weight:700;color:#273847;white-space:nowrap;font-variant-numeric:tabular-nums}.field-label{display:none}.state-select{width:100%;height:30px;border:1px solid #d5dde3;border-radius:4px;padding:2px 5px;background:#fff;font-size:12px;color:var(--muted)}.state-select[data-value=play],.state-select[data-value=yes]{color:#245f39;background:#edf7ef;border-color:#bdcfbf}.state-select[data-value=curious]{color:#77590f;background:#fff7e3}.state-select[data-value=none]{color:#747b80;background:#f0f2f3}.wanted-button{width:100%;height:30px;border:1px solid #d5dde3;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;background:#fff}.wanted-button svg{width:12px;height:14px}.wanted-button.active{color:#885b13;background:#fff2d8;border-color:#dbbf85}.readstate{display:inline-block;white-space:nowrap;font-size:12px;color:#78838b;padding:2px 4px;border-radius:3px}.readstate.play,.readstate.yes{color:#245f39;background:#edf7ef;font-weight:600}.readstate.curious{color:#77590f;background:#fff7e3}.readstate.wanted{color:#885b13;background:#fff2d8;font-weight:600}.memo-indicator{font-size:11px;color:var(--green)}.empty{text-align:center;padding:28px 12px}.empty strong{display:block;font-size:14px}.empty p{color:var(--muted);font-size:12px;line-height:1.6}.footer{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);padding-top:10px;line-height:1.6}.footer button{font-size:11px;text-decoration:underline}.notice{background:#fff2d8;padding:8px 10px;margin:6px 0;line-height:1.5;font-size:12px}#publish-state{color:var(--gold);font-size:11px}.brandmark{font-size:20px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border-radius:10px;background:var(--ink);color:#fff;padding:13px 21px;box-shadow:0 8px 35px #253b3529;max-width:min(600px,90vw);font-size:12px;z-index:20;line-height:1.7}.toast.error{background:#874a36}.lock{min-height:100vh;display:grid;place-items:center;padding:28px}.lockbox{max-width:480px;text-align:center}.lockbox .brandmark{margin:0 auto 20px;width:50px;height:50px;font-size:23px}.lockbox h1{font-size:25px}.lockbox p{font-size:13px;line-height:2;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:18px;padding:0;width:min(590px,calc(100vw - 30px));max-height:90dvh;background:var(--surface);color:var(--ink);box-shadow:0 30px 100px #1b322544}dialog::backdrop{background:#1b322557;backdrop-filter:blur(3px)}.dialog-inner{position:relative;padding:28px}.dialog-top{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.dialog-top h2{font-size:20px;line-height:1.6;margin:12px 0}.details{display:grid;grid-template-columns:100px 1fr;gap:11px;font-size:12px;line-height:1.7;margin:18px 0 22px}.details dt{color:var(--muted)}.details dd{margin:0}.memo-label{font-size:12px;font-weight:700;display:block;margin-bottom:9px}textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:12px;background:#f9faf4;color:var(--ink);font-size:13px;line-height:1.7}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:13px}details{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;font-size:11px;color:var(--muted);line-height:1.9}details summary{cursor:pointer;color:var(--ink)}.source-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.readonly-memo{font-size:13px;line-height:1.9;white-space:pre-wrap;background:#f3f4ed;padding:13px;border-radius:8px;overflow-wrap:anywhere}
@media(max-width:760px){
.owned-word{display:none}main{padding:0 8px 12px}.topbar{min-height:42px;gap:5px;flex-wrap:wrap;padding:5px 0}.app-title{font-size:15px}.toolbar{gap:5px;flex-wrap:wrap;margin-left:auto}.toolbar .btn{padding:4px 7px;min-height:30px;font-size:11px}.mode{font-size:11px}.views{gap:0;margin-bottom:7px;justify-content:space-between}.view-tab{font-size:12px;gap:4px;padding:9px 5px;min-height:38px}.view-tab strong{font-size:11px}.searchline{gap:5px;flex-wrap:wrap}.searchbox{flex-basis:100%}.searchbox input{font-size:16px;height:36px}.searchline>.filter{flex:1;max-width:none;height:32px}.filter-toggle{display:block;height:32px;min-width:88px}.filters{display:none;padding:7px 0;border-bottom:1px solid var(--line)}.filters.expanded{display:flex}.interest-options{flex-basis:100%;gap:3px}.chip{padding:5px 6px;min-height:32px;font-size:12px}.filters>.filter{flex:1;max-width:100%;height:34px}.reset{margin-left:auto}.resultline{min-height:27px;font-size:11px}.section-note{font-size:10px}
.list-head,.game{grid-template-columns:minmax(0,1fr) 57px 42px 36px;gap:4px;padding-left:6px;padding-right:6px}.list-head{min-height:27px;font-size:11px}.game{min-height:52px;padding-top:5px;padding-bottom:5px}.game-title{min-height:40px}.number{display:none}.mobile-number{display:inline;color:#75818c;font-size:10px;font-weight:400;font-variant-numeric:tabular-nums}.titlecopy>strong{font-size:13px;line-height:1.35}.meta{gap:4px;font-size:10px;margin-top:3px}.meta-publisher{display:none}.meta{flex-wrap:nowrap}.meta .tag{order:0;flex-shrink:0}.meta-date{order:1;flex-shrink:0;font-size:11px}.meta-genre{order:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memo-indicator{order:3}.tag{font-size:10px}.readstate{font-size:11px;padding:2px 1px}.state-select{font-size:11px;padding:0 1px;min-height:32px}.wanted-button{height:32px;font-size:10px;padding:0;gap:0}.wanted-button svg{display:none}.footer{display:block;font-size:10px}.footer>div{margin-top:4px}.dialog-inner{padding:18px}.dialog-top h2{font-size:18px}.details{grid-template-columns:80px 1fr;font-size:12px}.toast{bottom:12px}
}
@media(min-width:1000px){.game-title{display:grid;grid-template-columns:24px minmax(0,1fr)}.titlecopy{display:grid;grid-template-columns:minmax(150px,1fr) 370px;align-items:center;gap:10px}.titlecopy .meta{margin-top:0;display:grid;grid-template-columns:72px 85px 76px minmax(0,1fr);gap:6px}.meta-publisher{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memo-indicator{grid-column:1/-1}.game{min-height:38px;padding-top:2px;padding-bottom:2px}.game-title{min-height:33px}}

.tag{background:#245e87;color:#fff;text-align:center}.tag[data-platform="NGP"],.tag[data-platform="WS"],.tag[data-platform="GB"]{background:#4d5b66}.dialog-top .tag{white-space:normal;text-align:left}.section-note{margin-left:auto}.titlecopy .meta .tag{justify-self:start}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:4px 0;font-size:12px}.pagination .btn{min-height:28px;padding:3px 10px}.resultline{flex-wrap:wrap}#page-range{font-size:11px}
@media(max-width:760px){.views{flex-wrap:wrap}.view-tab{padding-left:3px;padding-right:3px;gap:3px;font-size:11px}.view-tab strong{font-size:10px}.section-note{white-space:normal}.meta .tag{max-width:72px}.meta-genre{flex-shrink:1}}
</style>

<body>
<div id="lock" class="lock"><div class="lockbox"><div class="brandmark">▤</div><h1>ゲームリスト</h1><p id="lockmessage">リストを読み込んでいます。</p><button id="retry" class="btn" hidden>もう一度読み込む</button></div></div>
<div id="app" class="app" hidden>
<main>
 <header class="topbar"><h1 class="app-title">ゲームリスト</h1><div class="toolbar"><span class="mode" id="mode-label">閲覧専用</span><button class="btn previewbtn" id="preview" hidden>閲覧画面</button><button class="btn primary" id="publish" hidden>スマホ用を更新</button></div></header>
 <nav class="views" aria-label="一覧の切り替え">
<button class="view-tab active" data-view="all">全件<strong id="stat-all">0</strong></button>
<button class="view-tab" data-view="wanted">探し中<strong id="stat-wanted">0</strong></button>
<button class="view-tab" data-view="interested">興味あり<strong id="stat-interested">0</strong></button>
<button class="view-tab" data-view="owned">ROM所有<strong id="stat-owned">0</strong></button>
</nav>
 <section><h2 id="view-title" class="sr-only">すべてのゲーム</h2>
 <div class="searchline"><div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" autocomplete="off" placeholder="タイトル・メーカー・メモを検索" aria-label="タイトル・メーカー・メモを検索"><button id="clearsearch" class="clearsearch" aria-label="検索文字を消す" hidden>×</button></div><select id="platform" class="filter" aria-label="機種"><option value="">すべての機種</option></select><button class="btn filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-options">絞り込み</button></div>
 <div class="filters" id="filter-options"><div class="interest-options" aria-label="興味で絞り込み"><span class="filter-label">興味</span><button class="chip active" data-interest="">すべて</button><button class="chip" data-interest="unknown">未確認</button><button class="chip" data-interest="curious">気になる</button><button class="chip" data-interest="play">遊びたい</button><button class="chip" data-interest="none">興味なし</button></div><select id="genre" class="filter" aria-label="ジャンル"><option value="">すべてのジャンル</option></select><select id="sort" class="filter" aria-label="並び順"><option value="date">発売日が古い順</option><option value="new">発売日が新しい順</option><option value="title">タイトル順</option></select><select id="owned-filter" class="filter" aria-label="ROM所有で絞り込み"><option value="">ROM所有：すべて</option><option value="yes">ROM所有あり</option><option value="no">ROM所有なし</option><option value="unknown">ROM所有未確認</option></select><button id="reset" class="reset">条件をクリア</button></div>
 <div id="notice" class="notice" hidden></div><div class="resultline"><span><strong id="result-count">0</strong>本 <span id="page-range"></span> <span id="publish-state"></span></span><span id="section-note" class="section-note"></span><div class="pagination" hidden><button class="btn" data-page="prev">前へ</button><span class="page-number"></span><button class="btn" data-page="next">次へ</button></div></div>

 <div class="list"><div class="list-head"><span>タイトル / ゲーム情報</span><span>興味</span><span>ROM<span class="owned-word">所有</span></span><span>探し中</span></div><div id="games"></div></div>
 <div class="pagination" hidden><button class="btn" data-page="prev">前へ</button><span class="page-number"></span><button class="btn" data-page="next">次へ</button></div>
 </section>
 <footer class="footer"><div id="footer-copy">タイトルを押すと、メモと詳しい情報を確認できます。</div><div><span id="updated"></span> <button id="reload">再読み込み</button></div></footer>
</main></div>
<dialog id="detail"><div class="dialog-inner" id="detail-content"></div></dialog>
<dialog id="share"><div class="dialog-inner"><div class="dialog-top"><h2>スマホで開く</h2></div><p style="font-size:13px;line-height:1.9">下の専用URLをスマホへ送り、ブックマークしてください。次回からパスワード入力なしで開けます。</p><p style="font-size:11px;color:var(--muted)">このURLを持つ人は記録を閲覧できます。ご自身だけでお使いください。</p><input id="share-url" readonly aria-label="スマホ専用URL" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:11px"><div class="dialog-actions"><button class="btn" id="copy-url">URLをコピー</button><a class="btn primary" id="open-viewer" target="_blank" rel="noopener noreferrer" style="text-decoration:none" href="#">閲覧画面を開く</a></div></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const EDITOR=/*LOCAL_MODE*/false;
const LABEL={unknown:'未確認',curious:'気になる',play:'遊びたい',none:'興味なし'};
const OWNED={unknown:'未確認',yes:'あり',no:'なし'};
let PLATFORM={NGP:'ネオジオポケット',NGPC:'ネオジオポケットカラー'};let platformInfo={},familyInfo={NGP:'ネオジオポケット'};const PAGE_SIZE=200;let page=0;
const COMPAT={mono:'モノクロ版（カラー本体でも動作）',dual:'カラー版・モノクロ本体にも対応',color:'カラー専用',unknown:'カラー版・モノクロ互換性は未確認'};
const VIEWS={all:'すべてのゲーム',wanted:'探しているソフト',interested:'気になる・遊びたい',owned:'ROM所有あり'};
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=value=>String(value??'').normalize('NFKC').toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/[\s・･!！?？'’"「」『』～~。、,.:：\-ー]/g,'');
let data, view='all', interest='', saving=Promise.resolve(), pending=0, failedSave=false,publishedRevision=-1,currentDetail=null,memoDirty=false;
let releaseNumbers=new Map();
let shareLink='',toastTimer;
function releaseCompare(a,b){return a.releaseDate.localeCompare(b.releaseDate)||a.title.localeCompare(b.title,'ja')||a.id.localeCompare(b.id);}
function rebuildReleaseNumbers(){releaseNumbers=new Map();const counts={};for(const g of [...data.games].filter(g=>!g.releaseOrderExcluded).sort(releaseCompare)){counts[g.platform]=(counts[g.platform]||0)+1;releaseNumbers.set(g.id,counts[g.platform]);}}
function releaseNumber(g){return releaseNumbers.has(g.id)?String(releaseNumbers.get(g.id)).padStart(3,'0'):'—';}
function dateUncertain(g){return ['unresolved','scope'].includes(g.releaseDateVerification?.grade);}
function dateLabel(g){return ({official:'公式資料で確認',press:'報道を参照',publication:'書籍の掲載日を採用',multiple:'複数資料から採用',unresolved:'発売日未確定',scope:'ゲーム対象外'})[g.releaseDateVerification?.grade]||(g.releaseDateSources?.length?'公式一覧で確認':'Excelの記録');}
function releaseEvidence(g){const notes=(g.catalogReview||[]).filter(r=>r.kind!=='再販・別版');const urls=[...new Set([...(g.releaseDateSources||[]),...(g.titleSources||[]),...notes.flatMap(r=>r.sources||[])])].filter(u=>u.startsWith('https://'));return notes.length||urls.length?'<details><summary>発売日の出典・訂正理由</summary>'+notes.map(r=>'<p>'+esc(r.kind)+'：'+esc(r.status)+'<br>'+esc(r.before)+' → '+esc(r.after)+(r.note?'<br>'+esc(r.note):'')+'</p>').join('')+(g.releaseVariants||[]).map(v=>'<p>'+esc(v.kind)+'：'+esc(v.releaseDate)+'</p>').join('')+'<div class="source-links">'+urls.map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">確認資料 '+(i+1)+' ↗</a>').join('')+'</div></details>':'';}
function familyOf(g){return platformInfo[g.platform]?.family||g.family||(g.platform==='NGPC'?'NGP':g.platform);}
function platformMatches(g,value){return !value||(value.startsWith('family:')?familyOf(g)===value.slice(7):g.platform===value);}
function platformTag(g,full=false){const info=platformInfo[g.platform];return '<span class="tag" data-platform="'+esc(g.platform)+'" title="'+esc(PLATFORM[g.platform]||g.platform)+'">'+esc(full?(PLATFORM[g.platform]||g.platform):(info?.badge||g.platform))+'</span>';}
function sourceDetails(g){const records=g.sourceRecords||[{sheet:g.sourceSheet||'ネオジオポケット',row:g.sourceRow,...g.legacy,genre:g.originalGenre,note:''}];return (g.originalCatalog?'<p>訂正前のタイトル：'+esc(g.originalCatalog.title)+'<br>訂正前の発売日：'+esc(g.originalCatalog.releaseDate)+'</p>':'')+records.map(r=>'<p>元のExcel：'+esc(r.sheet)+' '+esc(r.row)+'行目 ／ 元のNo：'+esc(Object.hasOwn(r,'no')?(r.no??'未記入'):(g.displayNo??g.id.split('-').at(-1)))+'<br>所有：'+(esc(r.owned)||'空欄')+' ／ 評価：'+(esc(r.rating)||'空欄')+' ／ 遊びたい：'+(esc(r.want)||'空欄')+'<br>ジャンル：'+(esc(r.genre)||'空欄')+(r.note?'<br>備考：'+esc(r.note):'')+'</p>').join('');}
function platformOptions(){const counts={};for(const g of data.games)counts[g.platform]=(counts[g.platform]||0)+1;let html='<option value="">すべての機種</option>';for(const [family,name] of Object.entries(familyInfo)){const codes=Object.keys(counts).filter(p=>(platformInfo[p]?.family||p)===family);const total=codes.reduce((sum,p)=>sum+counts[p],0);if(!total){html+='<option disabled>'+esc(name)+'（Excelに作品なし）</option>';continue;}if(codes.length===1){const p=codes[0];html+='<option value="'+esc(p)+'">'+esc(name)+'（'+total+'本）</option>';continue;}html+='<optgroup label="'+esc(name)+'"><option value="family:'+esc(family)+'">'+esc(name)+' 全区分（'+total+'本）</option>'+codes.map(p=>'<option value="'+esc(p)+'">'+esc(PLATFORM[p]||p)+'（'+counts[p]+'本）</option>').join('')+'</optgroup>';}return html;}
const bookmark='<svg viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h10v16l-5-3-5 3z"/></svg>';
async function api(path,body){const response=await fetch(path,{cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const result=await response.json();if(!response.ok)throw Error(result.error||'処理を完了できませんでした。');return result;}
function toast(message,error=false){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.toggle('error',error);$('toast').hidden=false;if(!error)toastTimer=setTimeout(()=>$('toast').hidden=true,4200);}
function setNotice(message=''){ $('notice').textContent=message;$('notice').hidden=!message; }
function status(){if(!EDITOR)return;$('mode-label').textContent=failedSave?'保存失敗':pending?'保存中…':'PCに保存済み';$('publish-state').textContent=data.revision>publishedRevision?'・スマホ用に未反映':'';}
function selectedGames(){const q=norm($('search').value);return data.games.filter(g=>(view!=='wanted'||g.wanted)&&(view!=='interested'||['curious','play'].includes(g.interest))&&(view!=='owned'||g.owned==='yes')&&(!interest||g.interest===interest)&&platformMatches(g,$('platform').value)&&(!$('genre').value||g.genre===$('genre').value)&&(!$('owned-filter').value||g.owned===$('owned-filter').value)&&(!q||norm([g.title,g.originalCatalog?.title,g.publisher,g.memo,g.genre,g.title.startsWith('キング・オブ・ファイターズ')?'KOF':''].join(' ')).includes(q))).sort((a,b)=>$('sort').value==='title'?a.title.localeCompare(b.title,'ja'):$('sort').value==='new'?b.releaseDate.localeCompare(a.releaseDate)||a.title.localeCompare(b.title,'ja')||a.id.localeCompare(b.id):releaseCompare(a,b));}
function stateControl(g,field,labels){const val=g[field];return EDITOR?`<select class="state-select" data-id="${esc(g.id)}" data-field="${field}" data-value="${esc(val)}" aria-label="${esc(g.title)}の${field==='interest'?'興味':'ROM所有'}">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v}</option>`).join('')}</select>`:`<span class="readstate ${esc(val)}">${esc(labels[val]||val)}</span>`;}
function render(){$('app').dataset.view=view;const counts={all:data.games.length,wanted:data.games.filter(g=>g.wanted).length,interested:data.games.filter(g=>['curious','play'].includes(g.interest)).length,owned:data.games.filter(g=>g.owned==='yes').length};for(const k of Object.keys(counts)){ $('stat-'+k).textContent=counts[k];}document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));document.querySelectorAll('[data-interest]').forEach(el=>el.classList.toggle('active',el.dataset.interest===interest));$('view-title').textContent=VIEWS[view];const chosen=$('platform').value;$('section-note').textContent=chosen?(chosen.startsWith('family:')?familyInfo[chosen.slice(7)]:(PLATFORM[chosen]||chosen)):new Set(data.games.map(familyOf)).size+'機種 / '+new Set(data.games.map(g=>g.platform)).size+'区分';const matches=selectedGames();page=Math.min(page,Math.max(0,Math.ceil(matches.length/PAGE_SIZE)-1));const games=matches.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);$('result-count').textContent=matches.length.toLocaleString('ja-JP');$('page-range').textContent=matches.length?'（'+(page*PAGE_SIZE+1)+'〜'+(page*PAGE_SIZE+games.length)+'本を表示）':'';for(const controls of document.querySelectorAll('.pagination')){controls.hidden=matches.length<=PAGE_SIZE;controls.querySelector('[data-page="prev"]').disabled=page===0;controls.querySelector('[data-page="next"]').disabled=(page+1)*PAGE_SIZE>=matches.length;controls.querySelector('.page-number').textContent=(page+1)+' / '+Math.max(1,Math.ceil(matches.length/PAGE_SIZE));}$('clearsearch').hidden=!$('search').value;$('updated').textContent='記録更新 '+new Date(data.updatedAt).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});$('games').innerHTML=games.length?games.map(g=>`<article class="game" data-game="${esc(g.id)}"><button class="game-title" data-detail="${esc(g.id)}"><span class="number" title="現登録内の機種別発売順">${releaseNumber(g)}</span><span class="titlecopy"><strong><span class="mobile-number">${releaseNumber(g)} </span>${esc(g.title)}</strong><span class="meta">${platformTag(g)}<span class="meta-genre">${esc(g.genre)}</span><span class="meta-date" title="${esc(dateLabel(g))}">${esc(g.releaseDate.replaceAll('-','.'))}${dateUncertain(g)?' ※':''}</span><span class="meta-publisher">${esc(g.publisher)}</span>${g.memo?'<span class="memo-indicator">▤ メモあり</span>':''}</span></span></button><div><span class="field-label">興味</span>${stateControl(g,'interest',LABEL)}</div><div><span class="field-label">ROM所有</span>${stateControl(g,'owned',OWNED)}</div><div><span class="field-label">探し中</span>${EDITOR?`<button class="wanted-button ${g.wanted?'active':''}" data-wanted="${esc(g.id)}" aria-pressed="${g.wanted}" aria-label="${esc(g.title)}を探し中${g.wanted?'から外す':'にする'}">${bookmark}${g.wanted?'探し中':'追加'}</button>`:`<span class="readstate ${g.wanted?'wanted':''}">${g.wanted?'探し中':'—'}</span>`}</div></article>`).join(''):`<div class="empty"><strong>${view==='wanted'&&!counts.wanted?'探しているソフトは、まだありません':'条件に合うゲームがありません'}</strong><p>${view==='wanted'&&!counts.wanted?'PCの一覧で「探し中」に追加すると、ここに表示されます。<br>ROMの所有状況とは別に記録できます。':'検索文字や絞り込み条件を変更してみてください。'}</p><button class="btn" id="empty-reset">すべてのゲームへ</button></div>`;status();}
function resetFilters(resetView=false){page=0;if(resetView)view='all';interest='';$('search').value='';$('platform').value='';$('genre').value='';$('owned-filter').value='';render();}
function changeView(next){view=next;resetFilters();}
function queueUpdate(id,changes){pending++;status();saving=saving.then(async()=>{if(failedSave)throw Error('保存に失敗した変更があります。再読み込みしてからやり直してください。');const updated=await api('/api/update',{id,changes,revision:data.revision});data=updated;rebuildReleaseNumbers();render();return updated;}).catch(err=>{failedSave=true;setNotice(err.message);toast(err.message,true);}).finally(()=>{pending--;status();});return saving;}
function showDetail(id){const g=data.games.find(g=>g.id===id);if(!g)return;currentDetail=id;memoDirty=false;$('detail-content').innerHTML=`<div class="dialog-top"><div>${platformTag(g,true)}<h2>${esc(g.title)}</h2></div></div><dl class="details"><dt>発売日</dt><dd><strong>${dateUncertain(g)?'未確定':esc(g.releaseDate)}</strong>${dateUncertain(g)?'<br><small>元の登録：'+esc(g.releaseDate)+'</small>':''} <span style="color:var(--muted);font-size:10px">（${esc(dateLabel(g))}）</span></dd><dt>発売順</dt><dd><strong>No.${releaseNumber(g)}</strong> ／ ${esc(PLATFORM[g.platform]||g.platform)}<br><small>${g.releaseOrderExcluded?'システムカードのため通番対象外。':'現登録内の順番。同日はタイトル順。未確定日は仮の並び順です。'}</small></dd><dt>発売元</dt><dd>${esc(g.publisher)}</dd><dt>ジャンル</dt><dd>${esc(g.genre)}</dd><dt>対応区分</dt><dd>${esc(g.compatibilityLabel||COMPAT[g.compatibility]||'未確認')}</dd><dt>興味 / ROM</dt><dd>${esc(LABEL[g.interest])} / ${esc(OWNED[g.owned])}</dd><dt>探し中</dt><dd>${g.wanted?'探しているソフトに登録済み':'未登録'}</dd></dl><label class="memo-label" for="memo">メモ</label>${EDITOR?`<textarea id="memo" maxlength="4000" placeholder="探すときの条件や、気になったことをメモ">${esc(g.memo)}</textarea><div class="dialog-actions"><button class="btn primary" id="save-memo">メモを保存</button></div>`:`<div class="readonly-memo">${esc(g.memo)||'メモはありません。'}</div>`}${releaseEvidence(g)}<details><summary>以前の記録・分類の根拠</summary>${sourceDetails(g)}<p>${esc(g.classificationNote)}</p><div class="source-links">${g.classificationSources.filter(url=>url.startsWith('https://')).map((url,i)=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">参考資料 ${i+1} ↗</a>`).join('')}</div></details>`;$('detail').showModal();if(EDITOR){$('memo').oninput=()=>{memoDirty=true;};$('save-memo').onclick=async()=>{const button=$('save-memo');button.disabled=true;await queueUpdate(id,{memo:$('memo').value});button.disabled=false;if(!failedSave){memoDirty=false;toast('メモを保存しました。');}};}}
function closeDetail(){if(memoDirty&&!confirm('保存していないメモを閉じますか？'))return;$('detail').close();currentDetail=null;}
async function decryptLibrary(){const encodedKey=new URLSearchParams(location.hash.slice(1)).get('k');if(!encodedKey)throw Error('ご自身の専用URLから開いてください。\nPCの「閲覧画面」から専用URLを確認できます。');if(!/^[A-Za-z0-9_-]{43}$/.test(encodedKey))throw Error('専用URLの鍵が正しくありません。PCからURLを確認してください。');const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const raw=b64(encodedKey.replaceAll('-','+').replaceAll('_','/')+'=');const response=await fetch('./library.enc.json',{cache:'no-store'});if(!response.ok)throw Error('記録を取得できません。通信状態を確認して再読み込みしてください。');const envelope=await response.json();if(envelope.schemaVersion!==1||envelope.algorithm!=='AES-256-GCM')throw Error('この記録形式には対応していません。');try{const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(envelope.iv),additionalData:new TextEncoder().encode('all-game-list:v1')},key,b64(envelope.ciphertext));return JSON.parse(new TextDecoder().decode(plain));}catch{throw Error('この専用URLでは記録を開けません。PCで最新の専用URLを確認してください。');}}
async function boot(){try{data=EDITOR?await api('/api/library'):await decryptLibrary();if(data.schemaVersion!==1||!Array.isArray(data.games))throw Error('記録形式が正しくありません。');if(EDITOR){const info=await api('/api/info');publishedRevision=info.publishedRevision;}platformInfo=data.platforms||{NGP:{name:'ネオジオポケット',badge:'NGP',family:'NGP'},NGPC:{name:'ネオジオポケットカラー',badge:'NGPC',family:'NGP'}};familyInfo=data.families||{NGP:'ネオジオポケット'};PLATFORM=Object.fromEntries(Object.entries(platformInfo).map(([k,v])=>[k,v.name]));$('platform').innerHTML=platformOptions();$('genre').innerHTML='<option value="">すべてのジャンル</option>'+[...new Set(data.games.map(g=>g.genre))].sort((a,b)=>a.localeCompare(b,'ja')).map(g=>`<option>${esc(g)}</option>`).join('');$('mode-label').textContent=EDITOR?'PCに保存済み':'閲覧専用';for(const id of ['publish','preview'])$(id).hidden=!EDITOR;$('footer-copy').textContent=EDITOR?'変更はPCに自動保存されます。「スマホ用を更新」で閲覧ページに反映します。':'閲覧専用です。タイトルを押すと、メモと詳しい情報を確認できます。';rebuildReleaseNumbers();$('lock').hidden=true;$('app').hidden=false;render();}catch(err){$('lockmessage').textContent=err.message;$('retry').hidden=false;}}
$('filter-toggle').onclick=()=>{const open=$('filter-options').classList.toggle('expanded');$('filter-toggle').setAttribute('aria-expanded',String(open));$('filter-toggle').textContent=open?'絞り込みを閉じる':'絞り込み';};
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>changeView(el.dataset.view));document.querySelectorAll('[data-interest]').forEach(el=>el.onclick=()=>{interest=el.dataset.interest;page=0;render();});$('search').oninput=()=>{page=0;render();};for(const id of ['platform','genre','sort','owned-filter'])$(id).onchange=()=>{page=0;render();};$('clearsearch').onclick=()=>{$('search').value='';page=0;render();$('search').focus();};$('reset').onclick=()=>resetFilters();$('games').addEventListener('click',event=>{const detail=event.target.closest('[data-detail]');if(detail)return showDetail(detail.dataset.detail);const wanted=event.target.closest('[data-wanted]');if(wanted&&EDITOR){const g=data.games.find(g=>g.id===wanted.dataset.wanted);wanted.disabled=true;queueUpdate(g.id,{wanted:!g.wanted});}if(event.target.id==='empty-reset')resetFilters(true);});$('games').addEventListener('change',event=>{const el=event.target.closest('[data-field]');if(el&&EDITOR){el.disabled=true;queueUpdate(el.dataset.id,{[el.dataset.field]:el.value});}});$('detail').addEventListener('cancel',event=>{event.preventDefault();closeDetail();});$('reload').onclick=()=>location.reload();$('retry').onclick=()=>location.reload();window.addEventListener('beforeunload',event=>{if(pending||memoDirty||failedSave){event.preventDefault();event.returnValue='';}});
$('preview').onclick=async()=>{try{await saving;if(failedSave)throw Error('未保存の変更があります。再読み込みして確認してください。');await api('/api/export',{});const links=await api('/api/links');shareLink=links.public||new URL(links.preview,location.origin).href;$('share-url').value=shareLink;$('open-viewer').href=shareLink;$('share').showModal();}catch(err){toast(err.message,true);}};$('copy-url').onclick=async()=>{try{await navigator.clipboard.writeText(shareLink);toast('専用URLをコピーしました。');}catch{$('share-url').select();toast('URLを選択しました。コピーしてお使いください。');}};
$('publish').onclick=async()=>{const button=$('publish');button.disabled=true;button.textContent='更新中…';try{await saving;if(failedSave)throw Error('未保存の変更があります。再読み込みして確認してください。');const result=await api('/api/publish',{});if(result.published)publishedRevision=result.revision;status();toast(result.message,!result.published);}catch(err){toast(err.message,true);}finally{button.disabled=false;button.textContent='スマホ用を更新';}};
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{page+=button.dataset.page==='next'?1:-1;render();document.querySelector('.resultline').scrollIntoView({block:'start'});});
for(const id of ['detail','share']){
 const dialog=$(id);let startedOutside=false;
 const outside=event=>{const r=dialog.getBoundingClientRect();return event.target===dialog&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom);};
 dialog.addEventListener('pointerdown',event=>{startedOutside=outside(event);});
 dialog.addEventListener('click',event=>{const dismiss=startedOutside&&outside(event);startedOutside=false;if(dismiss){if(id==='detail')closeDetail();else dialog.close();}});
}
window.addEventListener('hashchange',()=>{if(!EDITOR){data=null;$('detail').close();$('share').close();$('games').innerHTML='';$('app').hidden=true;$('lock').hidden=false;$('lockmessage').textContent='リストを読み込んでいます。';$('retry').hidden=true;boot();}});
boot();
</script>
</body></html>
